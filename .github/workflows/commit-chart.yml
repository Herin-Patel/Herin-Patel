name: Generate Commit Trend

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Weekly Commit Data
        run: |
          python << 'EOF'
          import subprocess
          import datetime
          from collections import defaultdict

          commits = subprocess.check_output(
              ["git", "log", "--pretty=format:%ad", "--date=short"]
          ).decode().splitlines()

          weekly = defaultdict(int)

          for d in commits:
              dt = datetime.datetime.strptime(d, "%Y-%m-%d")
              year, week, _ = dt.isocalendar()
              weekly[f"{year}-W{week}"] += 1

          weeks = sorted(weekly.keys())[-12:]

          width = 800
          height = 300

          svg = f'''
          <svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}">
          <style>
          .title {{ fill:white; font-size:20px; font-family:Arial; }}
          .label {{ fill:#cccccc; font-size:12px; font-family:Arial; }}
          .bar {{ fill:#00D4AA; }}
          </style>
          <rect width="100%" height="100%" fill="#0d1117"/>
          <text x="20" y="30" class="title">STS_Ecom Weekly Commit Trend</text>
          '''

          max_val = max([weekly[w] for w in weeks], default=1)

          bar_width = 40
          gap = 20
          x = 50

          for w in weeks:
              count = weekly[w]

              h = (count/max_val) * 180

              svg += f'''
              <rect class="bar" x="{x}" y="{250-h}" width="{bar_width}" height="{h}" />
              <text class="label" x="{x}" y="270">{w[-2:]}</text>
              <text class="label" x="{x}" y="{240-h}">{count}</text>
              '''

              x += bar_width + gap

          svg += "</svg>"

          with open("assets/commit-trend.svg","w") as f:
              f.write(svg)

          EOF

      - name: Commit SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add assets/commit-trend.svg

          git commit -m "Update commit trend chart" || echo "No changes"

          git push
